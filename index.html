    g.innerHTML=list.map((p,i)=>{
        const q=cart[p.id]||0,sel=q>0,m=META[p.c];
        return `<div id="c${p.id}" class="card bg-coco-900/70 rounded-2xl overflow-hidden border ${sel?'border-brand-600/50':'border-coco-800/15'} anim-up" style="animation-delay:${i*30}ms">
            <div class="aspect-[4/3] overflow-hidden relative">
                ${imgHTML(p)}
                <span class="absolute top-2 left-2 text-[10px] px-2 py-0.5 rounded-md bg-black/70 backdrop-blur-sm text-coco-300/80 font-medium tracking-wide">${m.e} ${m.l}</span>
                <span id="cb${p.id}" class="${sel?'absolute top-2 right-2 min-w-[20px] h-5 px-1 rounded-full bg-brand-500 text-white text-[10px] font-bold flex items-center justify-center':'hidden'}">${sel?q:''}</span>
            </div>
            <div class="p-3">
                <span class="text-[10px] px-2 py-0.5 rounded bg-brand-900/20 text-brand-300/60 font-medium tracking-wide">${p.t}</span>
                <h3 class="font-bold text-coco-50 text-sm mt-1.5 leading-tight truncate">${p.n}</h3>
                <p class="text-coco-300 font-bold text-base my-2">${fmt(p.p)}</p>
                <div class="flex items-center justify-center gap-3">
                    <button id="mn${p.id}" onclick="chg(${p.id},-1)" class="w-9 h-9 rounded-lg ${q>0?'bg-coco-800 text-coco-200 hover:text-red-400':'bg-coco-800/40 text-coco-200/30'} flex items-center justify-center transition-colors"><i class="fas fa-minus text-xs"></i></button>
                    <span id="q${p.id}" class="text-coco-50 font-bold text-base w-5 text-center">${q}</span>
                    <button onclick="chg(${p.id},1)" class="w-9 h-9 rounded-lg bg-brand-700/30 text-brand-300 hover:bg-brand-700/50 flex items-center justify-center transition-colors"><i class="fas fa-plus text-xs"></i></button>
                </div>
                <p id="s${p.id}" class="text-center text-[11px] text-brand-300/70 font-bold mt-1.5 ${sel?'':'hidden'}">${sel?fmt(p.p*q):''}</p>
            </div>
        </div>`;
    }).join('');
}

function chg(id,d){
    const cur=cart[id]||0,nxt=Math.max(0,cur+d);
    if(nxt===0) delete cart[id]; else cart[id]=nxt;
    const p=PROD.find(x=>x.id===id),q=cart[id]||0,has=q>0;
    const qEl=document.getElementById('q'+id);
    const sEl=document.getElementById('s'+id);
    const card=document.getElementById('c'+id);
    const badge=document.getElementById('cb'+id);
    const mn=document.getElementById('mn'+id);
    if(!qEl)return;
    qEl.textContent=q;
    qEl.classList.add('pop');setTimeout(()=>qEl.classList.remove('pop'),200);
    sEl.classList.toggle('hidden',!has);
    if(has)sEl.textContent=fmt(p.p*q);
    if(has){badge.className='absolute top-2 right-2 min-w-[20px] h-5 px-1 rounded-full bg-brand-500 text-white text-[10px] font-bold flex items-center justify-center';badge.textContent=q;}
    else{badge.className='hidden';}
    card.classList.toggle('border-brand-600/50',has);
    card.classList.toggle('border-coco-800/15',!has);
    mn.className=`w-9 h-9 rounded-lg ${has?'bg-coco-800 text-coco-200 hover:text-red-400':'bg-coco-800/40 text-coco-200/30'} flex items-center justify-center transition-colors`;
    updBadge();
    if(has&&d>0)toast(`${p.n} +1`);
}

function updBadge(){
    const cnt=Object.values(cart).reduce((a,b)=>a+b,0);
    ['nBadge','fBadge'].forEach(id=>{
        const el=document.getElementById(id);
        if(cnt>0){el.classList.remove('hidden');el.classList.add('flex');el.textContent=cnt>99?'99+':cnt;}
        else{el.classList.add('hidden');el.classList.remove('flex');}
    });
    document.getElementById('fab').classList.toggle('hidden',cnt===0);
}

function clearCart(){cart={};updBadge();renderGrid();renderCartList();toast('Keranjang dikosongkan');}

function openCart(){
    const o=document.getElementById('cartOv'),p=document.getElementById('cartP');
    o.classList.remove('hidden');p.classList.remove('slide-out');p.classList.add('slide-r');
    renderCartList();
}
function closeCart(){
    const p=document.getElementById('cartP');
    p.classList.remove('slide-r');p.classList.add('slide-out');
    setTimeout(()=>document.getElementById('cartOv').classList.add('hidden'),250);
}

function renderCartList(){
    const list=document.getElementById('cartList'),empty=document.getElementById('cartEmpty'),foot=document.getElementById('cartFoot');
    const entries=Object.entries(cart);
    if(!entries.length){list.classList.add('hidden');empty.classList.remove('hidden');foot.classList.add('hidden');return;}
    list.classList.remove('hidden');empty.classList.add('hidden');foot.classList.remove('hidden');
    const grouped={};
    entries.forEach(([id,qty])=>{const p=PROD.find(x=>x.id===+id);if(!p)return;if(!grouped[p.c])grouped[p.c]=[];grouped[p.c].push({...p,qty});});
    let html='',total=0;
    Object.entries(grouped).forEach(([cat,items])=>{
        const m=META[cat];
        html+=`<div class="mb-4"><p class="text-[11px] font-bold text-coco-300/40 uppercase tracking-wider mb-2">${m.e} ${m.l} — ${items[0].t}</p>`;
        items.forEach(it=>{
            total+=it.p*it.qty;
            html+=`<div class="flex items-center gap-3 p-3 rounded-xl bg-coco-900/50 border border-coco-800/10 mb-2">
                ${it.img?`<img src="${it.img}" alt="" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">`:`<div class="w-12 h-12 rounded-lg bg-coco-800/30 flex items-center justify-center flex-shrink-0"><i class="fas fa-ice-cream text-coco-700/40 text-lg"></i></div>`}
                <div class="flex-1 min-w-0">
                    <p class="text-coco-50 text-sm font-bold truncate">${it.n}</p>
                    <p class="text-coco-200/40 text-xs">${fmt(it.p)} × ${it.qty}</p>
                </div>
                <div class="flex items-center gap-1.5 bg-coco-800/60 rounded-lg px-1.5 py-1">
                    <button onclick="cChg(${it.id},-1)" class="w-7 h-7 rounded flex items-center justify-center text-coco-200/40 hover:text-red-400 text-xs"><i class="fas fa-minus"></i></button>
                    <span class="text-coco-50 text-sm font-bold w-4 text-center">${it.qty}</span>
                    <button onclick="cChg(${it.id},1)" class="w-7 h-7 rounded flex items-center justify-center text-coco-200/40 hover:text-brand-300 text-xs"><i class="fas fa-plus"></i></button>
                </div>
                <span class="text-coco-300 text-sm font-bold w-20 text-right">${fmt(it.p*it.qty)}</span>
            </div>`;
        });
        html+='</div>';
    });
    list.innerHTML=html;
    document.getElementById('cTotal').textContent=fmt(total);
}

function cChg(id,d){chg(id,d);renderCartList();}

function sendWA(){
    const entries=Object.entries(cart);
    if(!entries.length)return;

    const namaToko = document.getElementById('inputStoreName').value.trim();
    const lokasiToko = document.getElementById('inputStoreLoc').value.trim();
    
    let message = `*NOTA PEMESANAN ICE CREAM*\n`;
    message += `-------------------------------------------------------\n`;
    message += `*Nama Toko :* ${namaToko}\n`;
    message += `*Lokasi Toko :* ${lokasiToko}\n`;
    message += `-------------------------------------------------------\n`;
    message += `*Detail & Total Pemesanan :*\n`;

    let totalHarga = 0;
    const sortedEntries = entries.sort((a, b) => parseInt(a[0]) - parseInt(b[0]));

    sortedEntries.forEach(([id, qty]) => {
        const p = PROD.find(x => x.id == id);
        if(p) {
            message += `-  ${p.n} ${qty}\n`;
            totalHarga += p.p * qty;
        }
    });

    message += `\n\n`; 
    message += `-------------------------------------------------------\n`;
    message += `*Jumlah Harga :* ${fmt(totalHarga)}\n`;
    message += `-------------------------------------------------------\n`;
    message += `*Mohon Konfirmasi Pesanan Ini, Terimakasih!🙏*`;

    window.open('https://wa.me/6282241489084?text='+encodeURIComponent(message),'_blank');
    setTimeout(()=>closeCart(),400);
}

renderTabs();renderGrid();updBadge();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCart();});
</script>
</body>
</html>
